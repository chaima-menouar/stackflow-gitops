name: Validate GitOps
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install validator dependencies
        run: python3 -m pip install --user -r scripts/requirements.txt
      - name: Test safety logic
        run: python3 -m unittest discover -s scripts/tests -v
      - name: Validate source manifests
        run: python3 scripts/validate.py
      - name: Render both Kustomize overlays
        run: bash scripts/render.sh
