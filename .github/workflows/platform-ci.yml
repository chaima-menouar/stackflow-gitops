name: Platform API - Tests
on:
  pull_request:
    paths:
      - "services/platform/backend/**"
      - ".github/workflows/platform-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/platform/backend/**"
      - ".github/workflows/platform-ci.yml"
permissions:
  contents: read
jobs:
  api-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies
        working-directory: services/platform/backend
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Lint
        working-directory: services/platform/backend
        run: .venv/bin/ruff check --select E4,E7,E9,F app tests
      - name: Run API tests
        working-directory: services/platform/backend
        run: .venv/bin/python -m pytest -q
