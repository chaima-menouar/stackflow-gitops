# Use only with compose.codespaces.yaml (host networking)
global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: stackflow-platform
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8001"]
  - job_name: stackflow-demo
    metrics_path: /metrics
    static_configs:
      - targets: ["127.0.0.1:8000"]
