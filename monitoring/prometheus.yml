global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: "stackflow-platform"
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8001"]
  - job_name: "stackflow-demo"
    metrics_path: /metrics
    static_configs:
      - targets: ["demo:8000"]
